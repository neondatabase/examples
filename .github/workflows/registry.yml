name: Function Registry

# Fails when a template's template.tar.gz does not match the modules its template.json references.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "registry/**"
  push:
    branches: [main]
    paths:
      - "registry/**"

permissions:
  contents: read

jobs:
  archives:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check template archives
        run: node registry/scripts/pack.mjs --check
